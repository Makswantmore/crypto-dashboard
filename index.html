<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Real-time cryptocurrency tracking dashboard" />
    <link rel="manifest" href="/https://github.com/Makswantmore/crypto-dashboard/manifest.json" />
    <link rel="apple-touch-icon" href="/https://github.com/Makswantmore/crypto-dashboard/icon-192.png" />
    
    <title>Crypto Dashboard</title>
    <script type="module" crossorigin src="/https://github.com/Makswantmore/crypto-dashboard/assets/index-cjJw1pas.js"></script>
    <link rel="stylesheet" crossorigin href="/https://github.com/Makswantmore/crypto-dashboard/assets/index-CQdpc3YJ.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Регистрация Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
